[package]
name = "seoran"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shield = { version = "0.1.0", path = "../crates/shield" }
tao = "0.37.3"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "gzip"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.57.3", features = ["devtools"] }

[dev-dependencies]
tempfile = "3"
