name: Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Windows browser checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Show toolchain versions
        run: |
          rustc +stable -Vv
          node --version
      - name: Build the browser
        run: cargo +stable build --locked -p seoran
      - name: Test the workspace
        run: cargo +stable test --locked --workspace
      - name: Generate the offline Shield fixture
        shell: pwsh
        run: |
          cargo +stable run --locked --quiet -p shield --example dump_script -- 'https://www.youtube.com/watch?v=x' > "$env:RUNNER_TEMP/shield-fixture.js"
      - name: Run Shield scriptlet assertions
        shell: pwsh
        run: node crates/shield/tests/scriptlets.test.mjs "$env:RUNNER_TEMP/shield-fixture.js"
